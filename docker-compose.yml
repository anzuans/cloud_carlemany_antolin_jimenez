services:
  carlemany-backend:
    build:
      context: .
      target: carlemany-backend-base
    image: carlemany-backend-base
    env_file:
      - .env
    volumes:
      - type: bind
        source: .
        target: /carlemany-backend
    env_file:
      - .env
    ports:
      - "8000:80"
    networks:
      - carlemany-net
    depends_on:
      postgres:
        condition: service_healthy
      - redis

  black:
    build:
      context: .
      target: carlemany-backend-dev
    image: carlemany-backend-dev:latest
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./
        target: /carlemany-backend
        read_only: true
    entrypoint: sh -c "black --config .black --check --diff ."

  format:
    build:
      context: .
      target: carlemany-backend-dev
    image: carlemany-backend-dev:latest
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./
        target: /carlemany-backend
    entrypoint: sh -c "black --config .black . && ruff check --fix"

  test: &test
    build:
      context: .
      target: carlemany-backend-dev
    image: carlemany-backend-dev:latest
    env_file:
      - .env
    environment:
      E2E_BASE_URL: http://carlemany-backend
    volumes:
      - type: bind
        source: ./
        target: /carlemany-backend
    networks:
      - carlemany-net
    depends_on:
      carlemany-backend:
        condition: service_started
    entrypoint: pytest --maxfail=10

  redis:
    image: redis:7.2.4
    hostname: redis-cache
    container_name: redis-cache
    restart: on-failure
    command: redis-server
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6379:6379"
    networks:
      - carlemany-net

  postgres:
    image: postgres:13.4-alpine3.14
    environment:
      POSTGRES_DB: ${PSQL_DB_DATABASE}
      POSTGRES_PASSWORD: ${PSQL_DB_PASSWORD}
      POSTGRES_USER: ${PSQL_DB_USERNAME}
    env_file:
      - .env
    volumes:
      - type: volume
        source: carlemany-backend-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - carlemany-net

  make_migrations:
    build:
      context: .
      target: carlemany-backend-base
    env_file:
      - .env
    volumes:
      - type: bind
        source: .
        target: /carlemany-backend
    networks:
      - carlemany-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: aerich migrate

  migrate:
    build:
      context: .
      target: carlemany-backend-base
    env_file:
      - .env
    volumes:
      - type: bind
        source: .
        target: /carlemany-backend
    networks:
      - carlemany-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: aerich upgrade

  init_db:
    build:
      context: .
      target: carlemany-backend-base
    env_file:
      - .env
    volumes:
      - type: bind
        source: .
        target: /carlemany-backend
    networks:
      - carlemany-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: sh -c "aerich init -t app.database.TORTOISE_ORM && aerich init-db"

  test-cov:
    <<: *test
    entrypoint: pytest --maxfail=10 --cov --cov-report=term --cov-report=html --junitxml=tests/test-results/junit.xml


networks:
  carlemany-net:

volumes:
  carlemany-backend-data:
